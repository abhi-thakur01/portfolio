<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Portfolio CMS</title>
<style>
:root{--bg:#07070b;--panel:#101018;--panel2:#151522;--line:#292938;--text:#f6f4ee;--muted:#9696a6;--gold:#f0d060;--gold2:#c9a227;--green:#79dfa5;--red:#ff7d88;--shadow:0 20px 60px #0008}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 75% -10%,#282044 0,#0b0b12 32%,var(--bg) 65%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:#090910e8;backdrop-filter:blur(18px);overflow:auto}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;padding:6px 10px 22px}.brand i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;font-style:normal}.gold{color:var(--gold)}.nav-title{color:#666677;text-transform:uppercase;letter-spacing:.12em;font-size:10px;padding:16px 10px 8px}.nav button{width:100%;border:1px solid transparent;background:transparent;color:#aaaabd;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:#1b1b2a;border-color:#2b2b40;color:var(--gold)}.main{min-width:0;padding:28px 34px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:.15em}.title{font-size:30px;font-weight:850;margin:4px 0}.sub{color:var(--muted);margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #353548;background:#171724;color:#eee;padding:10px 14px;border-radius:10px;font-weight:750}.btn:hover{border-color:#56566d}.btn.primary{border:0;background:linear-gradient(100deg,var(--gold2),var(--gold));color:#10100e}.btn.danger{color:#ff9aa3}.card{background:linear-gradient(180deg,#12121de8,#0e0e16e8);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.sections{position:sticky;top:20px;height:max-content}.section-list button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#aaaabd;padding:10px;border-radius:9px}.section-list button.active{background:#1c1c2b;color:var(--gold)}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.editor-head h2{margin:0;font-size:19px}.status{color:var(--muted);font-size:12px}.success{color:var(--green)}.error{color:var(--red)}.fields{display:grid;gap:15px}.field{border:1px solid #272737;background:#0d0d15;border-radius:13px;padding:15px}.field-label{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.label{font-weight:750}.hint{font-size:11px;color:#6f6f80}.control{width:100%;border:1px solid #303043;background:#090910;color:#f4f2eb;border-radius:9px;padding:11px 12px;outline:none}.control:focus{border-color:#6c5d2c;box-shadow:0 0 0 3px #f0d06012}.textarea{min-height:100px;resize:vertical}.object{display:grid;gap:12px}.array{display:grid;gap:10px}.array-item{position:relative;border:1px solid #252536;background:#11111a;border-radius:12px;padding:13px}.array-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:8px}.mini{font-size:11px;padding:7px 9px}.add{border:1px dashed #414154;background:#11111a;color:var(--gold);padding:10px;border-radius:10px;width:100%}.image-box{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center}.image-preview{width:90px;height:70px;object-fit:cover;border-radius:9px;border:1px solid #303043;background:#090910}.media{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.media button{border:1px solid #343447;background:#171722;color:#bbb;padding:6px 9px;border-radius:8px;font-size:11px}.media img{width:36px;height:28px;object-fit:cover;border-radius:5px;vertical-align:middle;margin-right:5px}.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.asset{border:1px solid #2a2a3b;background:#10101a;border-radius:12px;padding:9px}.asset img{width:100%;height:105px;object-fit:cover;border-radius:8px;background:#090910}.asset-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:8px 0;color:#bbb;font-size:11px}.empty{padding:40px;text-align:center;color:var(--muted)}.mobile-menu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;left:-270px;width:250px;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.main{padding:20px}.layout{grid-template-columns:1fr}.sections{position:static}.stats{grid-template-columns:1fr}.top{align-items:flex-start}.image-box{grid-template-columns:1fr}.image-preview{width:100%;height:150px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const sections=[
 {group:'Website',items:[['hero','Hero','content/hero.json'],['personal','Personal','content/personal.json'],['about','About','content/about.json'],['nav','Navigation','content/nav.json']]},
 {group:'Content',items:[['roles','Roles','content/roles.json'],['skills','Skills','content/skills.json'],['services','Services','content/services/cms.json'],['projects','Projects','content/projects/gohighlevel-funnels.json'],['process','Process','content/process.json'],['faqs','FAQs','content/faqs.json']]},
 {group:'Settings',items:[['addresses','Contact / Addresses','content/addresses.json'],['seo','SEO','content/seo.json']]}
];
const allFiles=sections.flatMap(g=>g.items);let active=allFiles[0][2],data=null,sha='',dirty=false,media=[];const app=document.getElementById('app');
const icons=['Globe','Smartphone','Zap','Search','Target','Palette','RefreshCw','LayoutGrid','PenTool'];
const imageKey=/image|photo|avatar|logo|thumbnail|cover|ogImage/i;
const labelize=k=>k.replace(/([A-Z])/g,' $1').replace(/[_-]/g,' ').replace(/^./,s=>s.toUpperCase());
function pathGet(obj,path){return path.reduce((v,k)=>v==null?undefined:v[k],obj)}
function pathSet(obj,path,value){let v=obj;for(let i=0;i<path.length-1;i++)v=v[path[i]];v[path[path.length-1]]=value;dirty=true}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(path,opt){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function load(path=active){active=path;dirty=false;renderShell();setStatus('Syncing with GitHub…');try{const d=await api('/api/admin/content?path='+encodeURIComponent(path));sha=d.sha;data=JSON.parse(d.content);setStatus('Synced from GitHub','success');renderEditor()}catch(e){setStatus(e.message,'error')}}
function setStatus(text,cls=''){const el=document.getElementById('status');if(el){el.className='status '+cls;el.textContent=text}}
function inputFor(value,key,path){
 const current=pathGet(data,path); const isImg=imageKey.test(key||'');
 if(typeof value==='boolean')return `<input class="control" type="checkbox" ${value?'checked':''} data-bind="${path.join('.')}" style="width:20px;height:20px">`;
 if(typeof value==='number')return `<input class="control" type="number" value="${esc(value)}" data-bind="${path.join('.')}"/>`;
 if(key==='icon')return `<select class="control" data-bind="${path.join('.')}" data-type="icon">${icons.map(i=>`<option ${value===i?'selected':''}>${i}</option>`).join('')}</select>`;
 if(isImg)return `<div class="image-box"><img class="image-preview" src="${esc(value||'')}" onerror="this.style.visibility='hidden'"/><div><input class="control" value="${esc(value||'')}" placeholder="Image URL or upload below" data-bind="${path.join('.')}"/><div class="media"><label class="btn mini">Upload image<input type="file" accept="image/*" hidden data-upload="${path.join('.')}"/></label>${value?'<button type="button" class="mini" data-clear="'+path.join('.')+'">Clear</button>':''}</div></div></div>`;
 const multiline=String(value||'').length>90||/desc|bio|answer|description|deliverable/i.test(key||'');
 return multiline?`<textarea class="control textarea" data-bind="${path.join('.')}" placeholder="${labelize(key||'')}...">${esc(value??'')}</textarea>`:`<input class="control" value="${esc(value??'')}" data-bind="${path.join('.')}" placeholder="${labelize(key||'')}..."/>`;
}
function renderNode(value,path,key){
 if(Array.isArray(value)){
   const items=value.map((v,i)=>`<div class="array-item">${renderNode(v,path.concat(i),String(i))}<div class="array-actions"><button class="btn mini danger" data-remove="${path.concat(i).join('.')}" type="button">Remove</button></div></div>`).join('');
   return `<div class="array">${items||'<div class="empty">No items yet</div>'}<button class="add" type="button" data-add="${path.join('.')}" data-template="${esc(JSON.stringify(value[0]??''))}">+ Add item</button></div>`;
 }
 if(value&&typeof value==='object')return `<div class="object">${Object.entries(value).map(([k,v])=>`<div class="field"><div class="field-label"><span class="label">${labelize(k)}</span><span class="hint">${typeof v}</span></div>${renderNode(v,path.concat(k),k)}</div>`).join('')}</div>`;
 return inputFor(value,key,path);
}
function renderEditor(){const root=document.getElementById('editor');if(!root||!data)return;root.innerHTML=renderNode(data,[], '');bindFields();}
function clone(v){return JSON.parse(JSON.stringify(v))}
function infer(template){if(template&&typeof template==='object')return clone(template);if(typeof template==='number')return 0;if(typeof template==='boolean')return false;return ''}
function removeAt(path){const parent=path.slice(0,-1),idx=Number(path[path.length-1]);const arr=pathGet(data,parent);arr.splice(idx,1);dirty=true;renderEditor()}
function addAt(path,template){const arr=pathGet(data,path);arr.push(infer(template));dirty=true;renderEditor()}
function bindFields(){document.querySelectorAll('[data-bind]').forEach(el=>{el.addEventListener('input',()=>{const p=el.dataset.bind.split('.').filter(Boolean);let val=el.type==='checkbox'?el.checked:el.value;if(el.type==='number')val=Number(val);pathSet(data,p,val);if(el.type!=='checkbox'&&el.closest('.image-box')){const im=el.closest('.image-box').querySelector('img');if(im){im.src=val;im.style.visibility='visible'}}setStatus('Unsaved changes','')})});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeAt(b.dataset.remove.split('.')));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addAt(b.dataset.add.split('.').filter(Boolean),JSON.parse(b.dataset.template||'""')));document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{pathSet(data,b.dataset.clear.split('.'), '');renderEditor()});document.querySelectorAll('[data-upload]').forEach(i=>i.addEventListener('change',uploadImage))}
async function uploadImage(e){const file=e.target.files?.[0];if(!file)return;if(file.size>4*1024*1024){setStatus('Image must be under 4 MB','error');return}setStatus('Uploading image to GitHub…');const reader=new FileReader();reader.onload=async()=>{try{const d=await api('/api/admin/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,dataUrl:reader.result})});pathSet(data,e.target.dataset.upload.split('.'),d.url);await loadMedia();renderEditor();setStatus('Image uploaded. Publish to save the content link.','success')}catch(err){setStatus(err.message,'error')}};reader.readAsDataURL(file)}
async function save(){if(!data)return;setStatus('Publishing to GitHub…');try{const d=await api('/api/admin/content?path='+encodeURIComponent(active),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:JSON.stringify(data,null,2),sha})});sha=d.commit||sha;dirty=false;setStatus('Published to GitHub. Vercel will rebuild automatically.','success');setTimeout(()=>load(active),800)}catch(e){setStatus(e.message,'error')}}
async function loadMedia(){try{const d=await api('/api/admin/media');media=d.files||[]}catch{media=[]}}
function mediaView(){return `<div class="card"><div class="editor-head"><div><h2>Media Library</h2><div class="status">Images stored in GitHub under public/media</div></div><label class="btn primary">Upload image<input type="file" accept="image/*" hidden id="mediaUpload"/></label></div><div class="library">${media.length?media.map(m=>`<div class="asset"><img src="${esc(m.url)}"/><div class="asset-name" title="${esc(m.name)}">${esc(m.name)}</div><button class="btn mini" data-use-media="${esc(m.url)}">Copy path</button><button class="btn mini danger" data-delete-media="${esc(m.path)}">Delete</button></div>`).join(''):'<div class="empty">No uploaded images yet.</div>'}</div></div>`}
function renderShell(){app.innerHTML=`<div class="app"><aside class="sidebar" id="side"><div class="brand"><i>P</i><span>Portfolio <span class="gold">CMS</span></span></div><nav class="nav">${sections.map(g=>`<div class="nav-title">${g.group}</div>${g.items.map(([id,n,p])=>`<button class="${active===p?'active':''}" data-file="${p}">${n}</button>`).join('')}<div class="nav-title">Media</div><button data-media="1">Media Library</button></nav></aside><main class="main"><div class="top"><div><button class="btn mobile-menu" id="menu">☰</button><div class="eyebrow">Private content control</div><div class="title">Portfolio CMS</div><p class="sub">Edit the website visually. No JSON editing required.</p></div><div class="actions"><button class="btn" id="sync">↻ Sync GitHub</button><a class="btn" href="/">View website</a><button class="btn primary" id="publish">Publish changes</button></div></div><div class="stats"><div class="card stat"><strong>GitHub</strong><span>Source of truth</span></div><div class="card stat"><strong>Vercel</strong><span>Automatic deployment</span></div><div class="card stat"><strong>${dirty?'Draft':'Synced'}</strong><span id="status">${dirty?'Unsaved changes':'Ready'}</span></div></div><div id="content"></div></main></div>`;document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{document.getElementById('side').classList.remove('open');load(b.dataset.file)});document.getElementById('sync').onclick=()=>load(active);document.getElementById('publish').onclick=save;document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open'));renderEditor();if(!data){document.getElementById('content').innerHTML='<div class="card empty">Loading GitHub content…</div>'}}
function showEditor(){const c=document.getElementById('content');if(!c)return;c.innerHTML=`<div class="layout"><div class="card sections"><div class="eyebrow">Current section</div><div class="section-list">${allFiles.filter(x=>x[2].split('/')[1]===active.split('/')[1]).map(([id,n,p])=>`<button class="${p===active?'active':''}" data-file2="${p}">${n}</button>`).join('')||allFiles.map(([id,n,p])=>`<button class="${p===active?'active':''}" data-file2="${p}">${n}</button>`).join('')}</div></div><div class="card"><div class="editor-head"><div><h2>${labelize(active.split('/').pop().replace('.json',''))}</h2><div class="status">${dirty?'Changes not published':'Live GitHub content'}</div></div><div class="actions"><button class="btn" id="reload">Reload</button><button class="btn primary" id="publish2">Publish</button></div></div><div id="editor"></div></div></div>`;document.querySelectorAll('[data-file2]').forEach(b=>b.onclick=()=>load(b.dataset.file2));document.getElementById('reload').onclick=()=>load(active);document.getElementById('publish2').onclick=save;renderEditor()}
const oldRenderEditor=renderEditor;renderEditor=function(){if(document.getElementById('editor'))oldRenderEditor();else if(data){showEditor()}};
async function start(){const r=await fetch('/api/admin/content?path='+encodeURIComponent(active));if(r.status===401){app.innerHTML='<div style="max-width:520px;margin:15vh auto;padding:25px;background:#11111b;border:1px solid #292938;border-radius:18px;text-align:center"><h1>Portfolio <span class="gold">CMS</span></h1><p style="color:#999">Sign in with your authorized GitHub account.</p><a class="btn primary" href="/api/admin/login">Login with GitHub</a></div>';return}renderShell();await load(active);await loadMedia()}
app.addEventListener('click',async e=>{const use=e.target.closest('[data-use-media]');if(use){await navigator.clipboard?.writeText(use.dataset.useMedia);setStatus('Media path copied','success')}const del=e.target.closest('[data-delete-media]');if(del&&confirm('Delete this image from GitHub?')){try{await api('/api/admin/media?path='+encodeURIComponent(del.dataset.deleteMedia),{method:'DELETE'});await loadMedia();if(document.getElementById('content')&&document.querySelector('.library'))document.getElementById('content').innerHTML=mediaView()}catch(err){setStatus(err.message,'error')}}const med=e.target.closest('[data-media]');if(med){document.getElementById('content').innerHTML=mediaView();document.getElementById('mediaUpload')?.addEventListener('change',uploadLibrary)}});
async function uploadLibrary(e){const file=e.target.files?.[0];if(!file||file.size>4*1024*1024){setStatus('Choose an image under 4 MB','error');return}const r=new FileReader();r.onload=async()=>{try{await api('/api/admin/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name,dataUrl:r.result})});await loadMedia();document.getElementById('content').innerHTML=mediaView();setStatus('Image uploaded to GitHub','success')}catch(err){setStatus(err.message,'error')}};r.readAsDataURL(file)}
start();
</script>
</body></html>
